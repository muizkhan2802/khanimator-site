# Netlify configuration
# Docs: https://docs.netlify.com/configure-builds/file-based-configuration/

# No [build] section on purpose.
#
# There is no build command — build.py is a local development tool that commits
# its output, so Netlify only has to serve the static files already in the repo.
# With no build command and no publish directory set, Netlify serves the repo
# root, which is exactly what we want. Setting `publish = "."` explicitly can
# make Netlify treat the publish directory as identical to the base directory
# and refuse the deploy, so it is deliberately left out.

# ---------------------------------------------------------------- headers --

[[headers]]
  for = "/*"
  [headers.values]
    # ---------------------------------------------------------------------
    # PRE-LAUNCH ONLY — REMOVE THIS LINE TO GO LIVE
    #
    # Keeps the site out of search results while placeholder copy is still on
    # it (Patreon tiers, FAQ answers, response time, logo). This header is the
    # authoritative signal to crawlers; robots.txt alone does not reliably
    # prevent indexing of externally linked URLs.
    #
    # Removing it is one of two steps — also swap robots.txt back to allow.
    # ---------------------------------------------------------------------
    X-Robots-Tag = "noindex, nofollow"

    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# Fingerprint-free assets, so cache conservatively but not forever.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# -------------------------------------------------------------- redirects --

# Source files live in the repo root alongside the site; don't serve them.
[[redirects]]
  from = "/build.py"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/README.md"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/netlify.toml"
  to = "/404.html"
  status = 404
